name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Arba — traces conversations, LLM calls, and tool usage. Opt-in via `arba plugins enable observability/langfuse` or `arba tools → Langfuse Observability`."
author: Arcadia Global Teknologi
requires_env:
  - HERMES_LANGFUSE_PUBLIC_KEY
  - HERMES_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
